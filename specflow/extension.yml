schema_version: "1.0"
extension:
  id: "specflow"
  name: "Specflow"
  version: "1.0.2"
  description: >-
    Adds brainstorming, task decomposition, TDD execution, and spec review to
    spec-kit, following obra/superpowers skills when they are installed and a
    built-in protocol when they are not. Every command resumes after an
    interruption.
  author: "Specflow Contributors"
  repository: "https://github.com/DonalMoloney/super-spec-new"
  license: "MIT"
  homepage: "https://github.com/DonalMoloney/super-spec-new#readme"
requires:
  speckit_version: ">=0.16.2"
  optional_skills:
    - id: "brainstorming"
      source: "obra/superpowers"
      purpose: "Edge case exploration during the specification phase"
    - id: "writing-plans"
      source: "obra/superpowers"
      purpose: "Task decomposition from implementation plans"
    - id: "executing-plans"
      source: "obra/superpowers"
      purpose: "Batch execution with human checkpoints"
    - id: "subagent-driven-development"
      source: "obra/superpowers"
      purpose: "Parallel task dispatch to subagents"
    - id: "test-driven-development"
      source: "obra/superpowers"
      purpose: "RED-GREEN-REFACTOR discipline enforcement"
    - id: "requesting-code-review"
      source: "obra/superpowers"
      purpose: "Pre-evaluation code review checklists"
provides:
  commands:
    - name: "speckit.specflow.status"
      file: "commands/status.md"
      description: "Show current project progress and superpowers detection status"
    - name: "speckit.specflow.brainstorm"
      file: "commands/brainstorm.md"
      description: "Find edge cases and refine a spec using brainstorming skills"
    - name: "speckit.specflow.tasks"
      file: "commands/tasks.md"
      description: "Generate phased task breakdown using writing-plans skills"
    - name: "speckit.specflow.execute"
      file: "commands/execute.md"
      description: "Orchestrate implementation with TDD, subagents, and review gates"
    - name: "speckit.specflow.review"
      file: "commands/review.md"
      description: "Run code review against spec requirements using review skills"
  templates:
    - name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Constitution with development workflow and quality gates"
    - name: "spec-template"
      file: "templates/spec-template.md"
      description: "Spec with brainstorm prompts, open questions, and brainstorm log"
    - name: "plan-template"
      file: "templates/plan-template.md"
      description: "Plan with execution strategy and superpowers dispatch"
    - name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Tasks with TDD/REVIEW/SUBAGENT execution markers"
    - name: "checklist-template"
      file: "templates/checklist-template.md"
      description: "Checklist with code review and spec compliance categories"
hooks:
  after_tasks:
    command: "speckit.specflow.tasks"
    optional: true
    prompt: "Run Superpowers task decomposition and add execution markers?"
    description: "Check task coverage and add Superpowers execution markers after core task generation"
  before_implement:
    command: "speckit.specflow.execute"
    optional: true
    prompt: "Run Superpowers-guided implementation with TDD and checkpoints?"
    description: "Enforce TDD discipline and Superpowers execution guidance before core implementation"
  after_implement:
    command: "speckit.specflow.review"
    optional: true
    prompt: "Run Superpowers review against the specification and implementation?"
    description: "Review implementation against the spec, plan, tasks, and constitution"
tags: ["superpowers", "brainstorming", "tdd", "code-review", "subagent", "workflow", "claude-code", "copilot"]
