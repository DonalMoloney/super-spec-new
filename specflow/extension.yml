schema_version: "1.0"
extension:
  id: "specflow"
  name: "Specflow"
  version: "1.1.0"
  description: >-
    Adds brainstorming, task decomposition, TDD execution, and spec review to
    spec-kit, following obra/superpowers skills when they are installed. The
    execute command refuses to run until /speckit.analyze reports zero critical
    inconsistencies. The same command files run on Claude Code and on the
    GitHub Copilot CLI.
  author: "Specflow Contributors"
  repository: "https://github.com/DonalMoloney/super-spec-new"
  license: "MIT"
  category: "process"
  effect: "read-write"
  homepage: "https://github.com/DonalMoloney/super-spec-new#readme"
requires:
  speckit_version: ">=0.16.2"
  # spec-kit reads no key under optional_skills; superpowers-mapping.md holds the list.
  optional_skills:
    - id: "brainstorming"
      source: "obra/superpowers"
      purpose: "Finds edge cases while the spec is written"
    - id: "writing-plans"
      source: "obra/superpowers"
      purpose: "Breaks an implementation plan into tasks"
    - id: "executing-plans"
      source: "obra/superpowers"
      purpose: "Runs tasks in batches and waits at each checkpoint"
    - id: "subagent-driven-development"
      source: "obra/superpowers"
      purpose: "Hands an independent task to a subagent"
    - id: "test-driven-development"
      source: "obra/superpowers"
      purpose: "Keeps a task in RED-GREEN-REFACTOR order"
    - id: "requesting-code-review"
      source: "obra/superpowers"
      purpose: "Works through a checklist before the review starts"
provides:
  commands:
    - name: "speckit.specflow.status"
      file: "commands/status.md"
      description: "Print each feature's phase, its gate markers, and the superpowers detection result"
    - name: "speckit.specflow.brainstorm"
      file: "commands/brainstorm.md"
      description: "Probe a spec for edge cases and record the answers in its Open Questions"
    - name: "speckit.specflow.tasks"
      file: "commands/tasks.md"
      description: "Break a plan into phased tasks, one outcome per task"
    - name: "speckit.specflow.execute"
      file: "commands/execute.md"
      description: "Drive implementation through TDD, subagent dispatch, and review gates"
    - name: "speckit.specflow.review"
      file: "commands/review.md"
      description: "Check a change against the spec and the constitution, and score each finding"
    - name: "speckit.specflow.gate"
      file: "commands/gate.md"
      description: "Write a feature's clarify or analyze marker, or name the check that refused"
  scripts:
    - name: "risk-classifier"
      file: "gates/bash/risk-classifier.sh"
      runtimes: ["bash"]
      description: "Print HIGH or STANDARD for the diff between a base ref and HEAD"
    - name: "merge-gate"
      file: "gates/bash/merge-gate.sh"
      runtimes: ["bash"]
      description: "Block a merge while a Critical or Important finding is neither fixed nor rebutted"
    - name: "write-marker"
      file: "gates/bash/write-marker.sh"
      runtimes: ["bash"]
      description: "Write a feature's clarify or analyze marker once its gate passes"
    - name: "block-main-commit"
      file: "gates/bash/block-main-commit.sh"
      runtimes: ["bash"]
      description: "Block a commit that would land on main or master"
    - name: "test-gate"
      file: "gates/bash/test-gate.sh"
      runtimes: ["bash"]
      description: "Run the project's test command when an edit ticks a tasks.md task"
    - name: "artifact-lint"
      file: "gates/bash/artifact-lint.sh"
      runtimes: ["bash"]
      description: "Check a just-edited spec, plan, tasks, or checklist file against its template"
    - name: "session-start"
      file: "gates/bash/session-start.sh"
      runtimes: ["bash"]
      description: "Print open questions and the current feature's progress at session start"
    - name: "validate-findings"
      file: "gates/python/validate-findings.py"
      runtimes: ["python"]
      description: "Check a review findings document against the findings schema"
    - name: "validate-progress"
      file: "gates/python/validate-progress.py"
      runtimes: ["python"]
      description: "Check a feature's progress.yml against the resumability contract"
  templates:
    - name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "States the core principles, the development workflow, and the quality gates"
    - name: "spec-template"
      file: "templates/spec-template.md"
      description: "Carries an open questions table, a threat model, and a brainstorm log"
    - name: "plan-template"
      file: "templates/plan-template.md"
      description: "States the execution strategy the task breakdown reads"
    - name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Marks each task [P], [TDD], [REVIEW], or [SUBAGENT] and gives it a Verify row"
    - name: "checklist-template"
      file: "templates/checklist-template.md"
      description: "Covers spec compliance, code review, constitution, and test coverage"
hooks:
  after_clarify:
    command: "speckit.specflow.gate"
    optional: false
    description: "Write the feature's .clarified file once the spec holds no NEEDS CLARIFICATION line"
  after_analyze:
    command: "speckit.specflow.gate"
    optional: false
    description: "Write the feature's .analyzed file once the report holds no CRITICAL row"
  after_tasks:
    command: "speckit.specflow.tasks"
    optional: true
    priority: 10
    prompt: "Break the tasks down again with the writing-plans skill?"
    description: "Check that every user story has tasks and that each task carries its markers"
  before_tasks:
    command: "speckit.specflow.tasks"
    optional: true
    priority: 10
    prompt: "Hand the task breakdown to /speckit.specflow.tasks instead?"
    description: "Check the constitution and open-questions gates before /speckit.tasks starts"
  before_implement:
    command: "speckit.specflow.execute"
    optional: true
    priority: 10
    prompt: "Hand the implementation to /speckit.specflow.execute instead?"
    description: "Check the constitution and analyze gates before /speckit.implement starts"
  after_implement:
    command: "speckit.specflow.review"
    optional: true
    priority: 10
    prompt: "Review the completed phase against its spec?"
    description: "Review the completed phase against the spec, the plan, and the constitution"
tags: ["superpowers", "brainstorming", "tdd", "code-review", "subagent", "workflow", "claude-code", "copilot"]
