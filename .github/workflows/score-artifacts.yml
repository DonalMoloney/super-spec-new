name: Score artifacts

# This replay is path-filtered to the inputs that can change a golden score: the
# commands and templates the goldens were produced from, the scorer and its
# tests, the goldens themselves, and this workflow's own expectations. The
# filter lives in its own workflow because `paths:` is workflow-level: putting
# it in ci.yml would also gate the metadata and archive validation jobs, which
# must run on every change. Paths are repository-relative; the steps run from
# `specflow/`.
on:
  push:
    branches:
      - main
    paths:
      - "specflow/commands/**"
      - "specflow/templates/**"
      - "specflow/scripts/**"
      - "specflow/examples/**"
      - ".github/workflows/score-artifacts.yml"
  pull_request:
    paths:
      - "specflow/commands/**"
      - "specflow/templates/**"
      - "specflow/scripts/**"
      - "specflow/examples/**"
      - ".github/workflows/score-artifacts.yml"

jobs:
  score:
    name: Score golden artifacts
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: specflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scorer unit tests
        run: |
          set -euo pipefail
          pip install pytest
          python3 -m pytest scripts/tests/test_score_artifacts.py -q

      - name: Score every golden
        run: |
          set -euo pipefail
          python3 scripts/score-artifacts.py examples/static-landing-page/specs/001-static-landing-page > landing-page.json
          python3 scripts/score-artifacts.py examples/seeded-bug > seeded-bug.json
          python3 scripts/score-artifacts.py examples/link-audit/specs/001-link-audit > link-audit.json
          python3 scripts/score-artifacts.py examples/seeded-threat-model > seeded-threat-model.json
          python3 scripts/score-artifacts.py examples/seeded-open-question > seeded-open-question.json
          python3 scripts/score-artifacts.py examples/seeded-no-changelog > seeded-no-changelog.json
          python3 scripts/score-artifacts.py examples/seeded-missing-test > seeded-missing-test.json

      - name: Assert golden scores held
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          # link-audit is this fork's golden, built from the current templates,
          # so it carries no clarification marker at all. The landing page is
          # upstream's golden and must stay perfect until it is removed. The
          # seeded-bug golden carries one deliberate untraced criterion, so an
          # empty `untraced` there means the scorer stopped reporting the gap.
          # link-audit's Traceability table names test files this repository
          # never vendored, so test_exists is not asserted against it. Each
          # seeded-* fixture below breaks exactly one of the four newer
          # dimensions; a passing score there means the scorer stopped
          # reporting that gap.
          EXPECTATIONS = (
              ("link-audit.json", "spec_sections.score", 100.0),
              ("link-audit.json", "traceability.score", 100.0),
              ("link-audit.json", "task_ids.score", 100.0),
              ("link-audit.json", "traceability.untraced", []),
              ("link-audit.json", "needs_clarification.count", 0),
              ("landing-page.json", "spec_sections.score", 100.0),
              ("landing-page.json", "traceability.score", 100.0),
              ("landing-page.json", "task_ids.score", 100.0),
              ("landing-page.json", "traceability.untraced", []),
              ("landing-page.json", "needs_clarification.count", 1),
              ("landing-page.json", "threat_model.score", 100.0),
              ("landing-page.json", "open_questions.score", 100.0),
              ("landing-page.json", "changelog.score", 100.0),
              ("landing-page.json", "test_exists.score", 100.0),
              ("seeded-bug.json", "traceability.untraced", ["SC-003"]),
              ("seeded-threat-model.json", "threat_model.missing_mitigation", ["Spoofing"]),
              (
                  "seeded-open-question.json",
                  "open_questions.unresolved",
                  ["OQ-001", "OQ-002"],
              ),
              ("seeded-no-changelog.json", "changelog.rows", 0),
              ("seeded-missing-test.json", "test_exists.missing", ["FR-001"]),
          )


          def lookup(report, dotted_key):
              value = report
              for key in dotted_key.split("."):
                  value = value[key]
              return value


          reports = {
              name: json.loads(Path(name).read_text(encoding="utf-8"))
              for name in {name for name, _, _ in EXPECTATIONS}
          }

          failures = 0
          for name, dotted_key, expected in EXPECTATIONS:
              found = lookup(reports[name], dotted_key)
              if found == expected:
                  continue
              failures += 1
              print(f"FAIL: {name} {dotted_key}: expected {expected!r}, found {found!r}")

          if failures:
              raise SystemExit(
                  f"{failures} golden score assertion(s) failed. Re-run "
                  "scripts/score-artifacts.py on the named golden and either fix "
                  "the artifact or update the expectation in this workflow."
              )

          print("All golden score assertions passed.")
          PY
