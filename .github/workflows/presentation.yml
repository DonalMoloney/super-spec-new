name: Presentation

on:
  push:
    branches:
      - main
    paths:
      - "presentation/**"
  pull_request:
    paths:
      - "presentation/**"

jobs:
  render:
    name: Render the Marp deck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # ubuntu-latest ships Google Chrome, which Marp uses for PDF export.
      - name: Render to PDF
        run: npx --yes @marp-team/marp-cli@4.2.3 --theme-set presentation/marp-deck/global.css --pdf --allow-local-files presentation/marp-deck/deck.md -o deck.pdf

      - name: Lint the deck against the documentation standard
        run: python3 specflow/scripts/lint-standards.py presentation
