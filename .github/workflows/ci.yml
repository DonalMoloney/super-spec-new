name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Superseding a pull request run is fine: only the newest commit gets merged.
# A push to main must never be cancelled, or a merged commit goes untested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install --quiet --requirement requirements-dev.txt

      - name: Validate metadata and docs
        working-directory: specflow
        run: python3 scripts/validate-extension-metadata.py

      # The catalog installs from GitHub's generated tag ZIP, which spec-kit
      # size-validates before extracting. Rebuild that ZIP and check it here so
      # an oversized asset fails CI instead of failing `specify extension add`.
      - name: Validate release archive
        working-directory: specflow
        run: python3 scripts/validate-release-archive.py

      - name: Script tests
        working-directory: specflow
        run: python3 -m pytest scripts/tests -q

      - name: Review findings validator tests
        run: python3 -m pytest .claude/review/tests -q

      - name: Divergence measurer tests
        run: python3 -m pytest .claude/divergence/tests -q

      - name: Hook tests
        run: bash .claude/hooks/tests/run.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # verify.sh carries a copy of this file's run steps. These tests fail when
      # this file gains, loses, reorders or retargets one and the copy stands
      # still. tests/test_readme_commands.py reaches specify through uvx, so
      # this step follows the one that installs uv.
      - name: CI parity tests
        run: python3 -m pytest tests -q

      - name: Lint Markdown against the documentation standard
        run: python3 specflow/scripts/lint-standards.py

      - name: Shellcheck
        run: shellcheck -S warning verify.sh .claude/hooks/*.sh .claude/hooks/tests/run.sh specflow/scripts/*.sh

      - name: Ruff
        run: ruff check specflow/scripts .claude/review .claude/divergence

      - name: Structural smoke test
        working-directory: specflow
        run: bash scripts/e2e-smoke.sh

      - name: Agent e2e dry run against the example snapshot
        working-directory: specflow
        run: E2E_DRY_RUN=1 bash scripts/e2e-agent-claude.sh

      # The same seven stages from scripts/e2e-stages.sh, against a project
      # spec-kit initialised with --integration copilot. README.md claims the
      # extension runs on the Copilot CLI, and this step checks that claim
      # past the install layout scripts/e2e-smoke.sh asserts.
      - name: Copilot agent e2e dry run against the example snapshot
        working-directory: specflow
        run: E2E_DRY_RUN=1 bash scripts/e2e-agent-copilot.sh

      - name: Verify install with latest spec-kit
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          uvx --from git+https://github.com/github/spec-kit.git specify init --here --integration claude --ignore-agent-tools --force
          uvx --from git+https://github.com/github/spec-kit.git specify extension add "$GITHUB_WORKSPACE/specflow" --dev
          uvx --from git+https://github.com/github/spec-kit.git specify extension list | tee extension-list.txt
          # extension.yml declares what ships, so the counts and the hook
          # target commands are read from it rather than repeated here.
          manifest="$GITHUB_WORKSPACE/specflow/extension.yml"
          expected_commands=$(awk '/^provides:/{p=1} p&&/^  commands:/{c=1;next} c&&/^  [a-z]/{c=0} c&&/-[ ]*name:/{n++} END{print n+0}' "$manifest")
          expected_hooks=$(awk '/^hooks:/{h=1;next} h&&/^[a-z]/{h=0} h&&/^  [a-z_]+:/{n++} END{print n+0}' "$manifest")
          grep -q "Commands: $expected_commands | Hooks: $expected_hooks" extension-list.txt
          test -f .specify/extensions.yml
          for hook_command in $(awk '/^hooks:/{h=1;next} h&&/^[a-z]/{h=0} h&&/command:/{sub(/.*command:[ ]*/,"");gsub(/"/,"");print}' "$manifest" | sort -u); do
            grep -q "$hook_command" .specify/extensions.yml
          done

  smoke-floor:
    name: Smoke test the declared spec-kit floor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # extension.yml declares requires.speckit_version ">=0.16.2", and the
      # validate job installs spec-kit from git main. The step below is the
      # only one that installs the oldest host the manifest accepts.
      - name: Structural smoke test against the floor
        working-directory: specflow
        run: SPEC_KIT_GIT_URL=https://github.com/github/spec-kit.git@v0.16.2 bash scripts/e2e-smoke.sh
